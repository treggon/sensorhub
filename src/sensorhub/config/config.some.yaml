
server:
  host: 0.0.0.0
  port: 8082
  tls:
    enabled: false

sensors:
- id: sim1
  kind: sim
  module: sensorhub.adapters.simulated.simulated_adapter
  class: SimulatedAdapter
  description: Simulated sensor adapter for testing
  params:
    hz: 25.0
    require_ready: false
    ready_timeout_sec: 0.1
    transform:
      tx: 0.0
      ty: 0.0
      tz: 0.0
      roll_deg: 0.0
      pitch_deg: 0.0
      yaw_deg: 0.0
      scale: 1.0

- id: gps1
  kind: gps
  module: sensorhub.adapters.ublox_gps.ublox_adapter
  class: UbloxGPSAdapter
  description: Ublox GPS on /dev/ttyACM0 at 9600bps
  params:
    port: /dev/ttyACM0
    baudrate: 9600
    timeout: 1.0
    parse_ubx: false
    require_ready: false
    ready_timeout_sec: 12.0
    transform:
      tx: 0.0
      ty: 0.0
      tz: 0.0
      roll_deg: 0.0
      pitch_deg: 0.0
      yaw_deg: 0.0
      scale: 1.0

- id: rplidar1
  kind: lidar2d
  module: sensorhub.adapters.rplidar_s2.rplidar_adapter
  class: RPLidarS2Adapter
  description: RPLidar S2 on /dev/ttyUSB0 at 1Mbps
  params:
    port: /dev/ttyUSB0
    baud: 1000000
    hz: 12
    require_ready: true
    ready_timeout_sec: 15.0
    require_wrap_for_publish: true
    wrap_threshold_deg: 1.0
    max_points: 4096
    drain_scans_per_tick: 64
    poll_interval: 0.001
    strict_parse_only: false
    enable_latest_raw_cache: true
    use_sdk_bridge: true
    ultra_simple_path: /home/dev/treggon/rplidar_sdk/output/Linux/Release/ultra_simple
    use_pty: true
    prefer_pty: true
    force_line_buffering: true
    use_channel_args: true
    launch_timeout_sec: 15.0
    fastpath_after_handshake: true
    debug_log_first_lines: 30
    echo_stdout: true
    log_parsed_triples: false
    fallback_to_python_on_sdk_failure: true
    min_points: 180
    max_revolution_ms: 1000.0
    duplicate_angle_resolution: 0.0
    target_points_per_rev: 0
    smoothing_window: 0
    smoothing_strategy: mean
    watchdog_no_data_ms: 3000.0
    watchdog_no_publish_ms: 5000.0
    transform:
      tx: 0.0
      ty: 0.0
      tz: 0.0
      roll_deg: -90.0
      pitch_deg: 0.0
      yaw_deg: 0.0
      scale: 1.0
    unity_euler_deg:
      x: -90
      y: 0
      z: 0

- id: usb_cam1
  kind: camera
  module: sensorhub.adapters.uvc_camera.uvc_camera_adapter
  class: UVCCameraAdapter
  description: USB Camera on /dev/video0
  params:
    device: 0
    width: 1280
    height: 720
    fps: 30
    quality: 80
    require_ready: true
    ready_timeout_sec: 5.0
    transform:
      tx: 0.0
      ty: 0.0
      tz: 0.0
      roll_deg: 0.0
      pitch_deg: 0.0
      yaw_deg: 0.0
      scale: 1.0

- id: livox
  kind: lidar
  module: sensorhub.adapters.livox_mid360.livox_adapter
  class: LivoxMid360Adapter
  description: Livox Mid-360 LiDAR over Ethernet
  params:
    hz: 10
    require_ready: true
    ready_timeout_sec: 15.0
    transform:
      tx: 0.0
      ty: 0.0
      tz: 0.0
      roll_deg: 45.0
      pitch_deg: 0.0
      yaw_deg: 0.0
      scale: 1.0

# NEW: Voxel adapter that consumes 'livox' and publishes a 3D voxel grid
- id: livox_voxel
  kind: voxelgrid
  module: sensorhub.adapters.livox_mid360.livox_voxel_adapter
  class: LivoxVoxelAdapter
  description: IMU-corrected 3D voxel grid (0.025 m) from Livox Mid-360
  params:
    source_id: livox
    voxel_size_m: 0.025
    grid_xy_m: 20.0
    grid_z_m: [-2.0, 8.0]
    chunk_size: 32
    imu_threshold_radps: 0.01
    min_hits_for_occupied: 3
    publish_hz: 2.0
    climb_limit_deg: 45.0
    # optional transform if you want to tweak alignment:
    transform:
      tx: 0.0
      ty: 0.0
      tz: 0.0
      roll_deg: 0.0
      pitch_deg: 0.0
      yaw_deg: 0.0
      scale: 1.0
