# log_conf.yaml
version: 1
disable_existing_loggers: False
formatters:
  default:
    format: "%(asctime)s %(levelname)s %(name)s %(message)s"
  access:
    format: "%(asctime)s %(levelname)s %(name)s %(message)s"
handlers:
  default:
    class: logging.StreamHandler
    formatter: default
    stream: ext://sys.stderr
  access:
    class: logging.StreamHandler
    formatter: access
    stream: ext://sys.stdout
loggers:
  uvicorn.error:
    level: INFO
    handlers: [default]
    propagate: no
  uvicorn.access:
    level: INFO
    handlers: [access]
    propagate: no
root:
  level: DEBUG
  handlers: [default]
